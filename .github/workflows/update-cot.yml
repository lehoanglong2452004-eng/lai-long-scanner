name: Update COT data

# The CFTC publishes the Commitments of Traders report every Friday (positions as of Tuesday).
on:
  schedule:
    - cron: '30 2 * * 6'   # Saturday 02:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/update-cot.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/cot.json; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cot.json
          git commit -m "Update COT data"
          git push
